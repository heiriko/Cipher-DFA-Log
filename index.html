<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --nav:#2f343b; --nav2:#262b31; --navtx:#c3c9d0; --navac:#ffffff;
    --accent:#2477c9; --accentd:#1b5e9e;
    --green:#5a9e2f; --greenbg:#eef6e6;
    --bg:#e9ecf0; --panel:#ffffff; --line:#d7dbe1; --line2:#edeff2;
    --text:#2d3239; --muted:#6c7480; --head:#f4f5f7;
    --sel:#dcecfb; --hover:#f1f7fd; --danger:#c0392b; --amber:#b9770e;
    --sans:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    --mono:'Consolas','SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5}
  #app{min-height:100vh}
  a{color:var(--accent);text-decoration:none}

  /* ---------- top nav ---------- */
  .ent-nav{display:flex;align-items:center;background:var(--nav);color:var(--navtx);height:46px;padding:0 14px;gap:2px}
  .ent-brand{display:flex;align-items:center;gap:9px;font-weight:600;color:#fff;padding-right:16px;white-space:nowrap}
  .ent-brand .logo{width:20px;height:20px;border-radius:3px;background:linear-gradient(135deg,var(--accent),#39a0c9);display:inline-block}
  .ent-brand small{font-weight:400;color:var(--navtx);font-size:11px}
  .ent-tabs{display:flex;align-items:center;height:46px;overflow:hidden;flex:1 1 auto;min-width:0}
  .ent-tab{padding:0 14px;height:46px;line-height:46px;color:var(--navtx);font-size:13px;cursor:default;white-space:nowrap}
  .ent-tab.on{color:#fff;background:var(--nav2);box-shadow:inset 0 -2px 0 var(--accent)}
  .ent-nav .spacer{flex:0 0 8px}
  .ent-search,.ent-user,.ent-reset{flex:none}
  .ent-search{background:var(--nav2);border:1px solid #3a4048;border-radius:3px;color:var(--navtx);font-size:12px;padding:5px 9px;width:170px}
  .ent-search::placeholder{color:#7f868f}
  .ent-reset{color:#fff;font-size:12px;border:1px solid #4a515a;border-radius:3px;padding:5px 11px;margin-left:12px;cursor:pointer;white-space:nowrap}
  .ent-reset:hover{background:var(--nav2)}
  .ent-reset.warn{background:var(--danger);border-color:var(--danger);color:#fff}
  .ent-user{color:#fff;font-size:12px;padding-left:14px;white-space:nowrap}
  .ent-user b{font-weight:600}

  /* ---------- shell: sidebar + main ---------- */
  .ent-shell{display:flex;min-height:calc(100vh, 46px)}
  .ent-side{width:210px;background:#fbfbfc;border-right:1px solid var(--line);flex:none;padding:10px 0;font-size:12.5px}
  .ent-side .grp{color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;padding:12px 16px 5px}
  .ent-side .it{padding:7px 16px;color:#41474f;cursor:default;border-left:3px solid transparent}
  .ent-side .it.on{background:#eaf2fb;border-left-color:var(--accent);color:var(--accentd);font-weight:600}
  .side-kv{display:flex;justify-content:space-between;padding:5px 16px;font-size:12px;color:#41474f}
  .side-kv span{color:var(--muted)} .side-kv b{font-weight:600}
  .side-kv .sev-h{color:#fff;background:var(--danger);font-size:10px;padding:1px 6px;border-radius:2px;letter-spacing:.4px}
  .side-note{padding:4px 16px 8px;font-size:11.5px;color:var(--muted);line-height:1.5}
  .ent-main{flex:1;min-width:0;padding:16px 20px 40px}
  @media(max-width:920px){.ent-side{display:none} .ent-main{padding:12px}}
  @media(max-width:820px){.ent-tabs{display:none} .ent-search{display:none}}

  .ent-crumb{color:var(--muted);font-size:12px;margin-bottom:4px}
  .ent-title{font-size:20px;font-weight:600;margin:0 0 14px;color:#23272d}

  /* ---------- toolbar / tabs ---------- */
  .ent-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:0}
  .ent-toolbar .lbl{color:var(--muted);font-size:12px;margin-right:2px}
  .logtabs{display:flex;gap:0;flex-wrap:wrap}
  .logtab{padding:7px 15px;font-size:12.5px;cursor:pointer;border:1px solid var(--line);border-right:none;background:#f7f8fa;color:#41474f}
  .logtab:first-child{border-radius:3px 0 0 3px}
  .logtab:last-child{border-right:1px solid var(--line);border-radius:0 3px 3px 0}
  .logtab:hover{background:#eef1f5}
  .logtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .ent-toolbar .rt{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
  .fakebtn{border:1px solid var(--line);background:#fff;border-radius:3px;padding:6px 10px;color:#41474f;font-size:12px}

  .logmeta{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;color:var(--muted);font-size:12px}
  .logmeta .name{font-family:var(--mono);color:#41474f}
  .logmeta .cnt{font-size:11.5px}

  /* ---------- table ---------- */
  .logbox{border:1px solid var(--line);background:var(--panel);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:9px 12px;color:#41474f;font-weight:600;background:var(--head);
    border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
  thead th .caret{color:#aab0b8;font-size:9px;margin-left:4px}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{background:#eceef1}
  thead th.on{color:var(--accentd)} thead th.on .caret{color:var(--accent)}
  tbody td{padding:8px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;color:#3a3f46}
  tbody td.cbx{width:34px;padding-left:12px;padding-right:0}
  thead th.cbx{width:34px}
  .cb{display:inline-block;width:14px;height:14px;border:1px solid #b6bcc4;border-radius:2px;background:#fff;vertical-align:middle;position:relative}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover{background:var(--hover)}
  tbody tr.selected{background:var(--sel)}
  tbody tr.selected .cb{background:var(--accent);border-color:var(--accent)}
  tbody tr.selected .cb::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  tbody tr.selected td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  tbody tr.ro .cb{opacity:.35}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.wrong{background:#fbe7e4;animation:flash .4s}
  @keyframes flash{0%{background:#f6cfc9}100%{background:#fbe7e4}}
  @media(prefers-reduced-motion:reduce){tbody tr.wrong{animation:none}}

  /* ---------- incident workbench (questions) ---------- */
  .wb{margin-top:16px;border:1px solid var(--line);background:var(--panel)}
  .wb-head{display:flex;align-items:center;gap:10px;background:var(--nav);color:#fff;padding:9px 14px;font-size:12.5px;font-weight:600}
  .wb-head .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px rgba(192,57,43,.25)}
  .wb-head .prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:400;color:var(--navtx);font-family:var(--mono);font-size:11.5px}
  .bar{width:110px;height:6px;background:#454b53;border-radius:3px;overflow:hidden}
  .bar>span{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
  .wb-body{padding:16px 16px 18px}
  .qcount{color:var(--muted);font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .qcount b{color:var(--accentd)}
  .task{border-left:3px solid var(--accent);background:#f7fafd;padding:12px 15px;margin-bottom:14px}
  .task h2{font-size:15px;margin:0 0 5px;color:#23272d;font-weight:600}
  .task p{margin:0;color:#41474f;font-size:13.5px}
  .unlock{background:#fff8e8;border:1px solid #f0dca6;color:#8a6516;padding:8px 12px;font-size:12.5px;margin-bottom:12px}

  .verdict-opts{display:flex;flex-direction:column;gap:8px;margin:0 0 14px;max-width:520px}
  .vopt{font-family:var(--sans);font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);padding:11px 14px;text-align:left;display:flex;align-items:center;gap:10px}
  .vopt::before{content:"";width:14px;height:14px;border:1px solid #b6bcc4;border-radius:50%;flex:none}
  .vopt:hover{background:var(--hover)}
  .vopt.sel{border-color:var(--accent);background:var(--sel)}
  .vopt.sel::before{border:4px solid var(--accent);background:#fff}

  .answerbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .answerbar .selinfo{color:var(--muted);font-size:12.5px}
  .ans-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ans-input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:3px;padding:9px 11px;font-family:var(--mono);font-size:13px;color:var(--text)}
  .ans-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(36,119,201,.18)}
  .cc-link{font-size:12px;color:var(--accent);white-space:nowrap;border:1px solid var(--line);border-radius:3px;padding:8px 11px}
  .cc-link:hover{background:var(--hover)}
  .btn{font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--accentd);
    background:var(--accent);color:#fff;border-radius:3px;padding:8px 18px}
  .btn:hover{background:var(--accentd)}
  .btn:disabled{background:#b8c4d0;border-color:#b8c4d0;cursor:not-allowed}
  .btn.ghost{background:#fff;color:#41474f;border:1px solid var(--line)}
  .btn.ghost:hover{background:#f1f3f6}
  .btn:focus-visible,tr:focus-visible,.vopt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .feedback{margin-top:14px;padding:13px 15px;font-size:13.5px;display:none;border:1px solid var(--line)}
  .feedback.show{display:block}
  .feedback.good{background:var(--greenbg);border-color:#c3e0a8}
  .feedback.nudge{background:#fdf3e3;border-color:#f0dca6}
  .feedback h3{font-size:13.5px;margin:0 0 6px;font-weight:700}
  .feedback.good h3{color:#3f7a1f} .feedback.nudge h3{color:#8a6516}
  .feedback p{margin:0 0 10px} .feedback p:last-child{margin:0}
  .feedback code{font-family:var(--mono);background:#eef1f4;padding:1px 5px;border-radius:2px;font-size:.92em}
  .next-row{margin-top:12px;display:flex;justify-content:flex-end}
  code{font-family:var(--mono)}

  /* ---------- login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#2f343b 0,#262b31 100%);padding:20px}
  .login-card{width:400px;max-width:100%;background:#fff;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.35);overflow:hidden}
  .login-top{background:var(--nav);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:10px}
  .login-top .logo{width:24px;height:24px;border-radius:3px;background:linear-gradient(135deg,var(--accent),#39a0c9)}
  .login-top b{font-size:15px} .login-top small{display:block;color:var(--navtx);font-size:11px;font-weight:400}
  .login-body{padding:24px}
  .login-body h1{font-size:16px;margin:0 0 4px;color:#23272d}
  .login-body .sub{color:var(--muted);font-size:12.5px;margin:0 0 20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11.5px;color:#41474f;margin-bottom:5px;font-weight:600}
  .field input{width:100%;border:1px solid var(--line);border-radius:3px;padding:9px 11px;font-size:13.5px;font-family:var(--sans);color:var(--text)}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(36,119,201,.18)}
  .login-body .btn{width:100%;justify-content:center;padding:10px}
  .boot{font-family:var(--mono);font-size:11.5px;color:var(--green);margin-top:12px;min-height:16px}
  .login-foot{background:#f4f5f7;border-top:1px solid var(--line);padding:11px 24px;color:var(--muted);font-size:11px;text-align:center}

  /* ---------- briefing / conclusion cards ---------- */
  .card{background:#fff;border:1px solid var(--line);max-width:820px}
  .card-head{background:var(--head);border-bottom:1px solid var(--line);padding:11px 16px;font-weight:600;color:#23272d;display:flex;align-items:center;gap:10px}
  .card-head .sev{font-size:10.5px;font-weight:700;color:#fff;background:var(--danger);padding:2px 7px;border-radius:2px;letter-spacing:.4px}
  .card-body{padding:18px 20px}
  .kv{display:flex;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line2)}
  .kv:last-of-type{border-bottom:none}
  .kv .k{width:120px;color:var(--muted);flex:none;font-size:12px}
  .lede{color:#3a3f46;font-size:13.5px;margin:0 0 16px;line-height:1.6}
  .tl{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
  .tl:last-child{border-bottom:none}
  .tl .t{font-family:var(--mono);color:var(--accentd);min-width:52px;font-size:12.5px}
  .verdict-box{background:var(--head);border:1px solid var(--line);padding:16px;text-align:center;margin-top:14px}
  .verdict-box .rank{font-size:20px;font-weight:700;color:#23272d;margin:4px 0}
  .badge-ok{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-weight:600}
  .badge-ok::before{content:"\2713";font-weight:700}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>

function shuffleLogs(){
  logOrder = BASE_KEYS.slice();
  for(let i=logOrder.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=logOrder[i]; logOrder[i]=logOrder[j]; logOrder[j]=t; }
}
function currentLogs(){ return (STEPS[qIdx] && STEPS[qIdx].level>=3) ? [...logOrder,'edr'] : logOrder; }
const rowLog = {};
for(const k of ALL_KEYS){ for(const r of LOGS[k].table.rows){ rowLog[r.id]=k; } }

function updateTabs(){
  const keys=currentLogs();
  if(!keys.includes(activeTab)) activeTab=keys[0];
  const el=document.getElementById('logtabs');
  if(!el) return;
  el.innerHTML=keys.map(k=>`<button class="logtab${k===activeTab?' active':''}" data-tab="${k}">${LOGS[k].name}</button>`).join('');
  el.querySelectorAll('.logtab').forEach(b=>{ b.onclick=()=>switchTab(b.dataset.tab); });
}

function switchTab(tab){
  activeTab=tab; sortCol=null; sortDir='asc';
  document.querySelectorAll('#logtabs .logtab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  refreshLogTable();
}
function sortBy(ci){ if(sortCol===ci){ sortDir=sortDir==='asc'?'desc':'asc'; } else { sortCol=ci; sortDir='asc'; } refreshLogTable(); }
function resetSession(){
  qIdx=-1; solved=0; wrong=0; analyst=""; questionComplete=false; activeTab='email'; selectedVerdict=null;
  searchTerm=''; sortCol=null; sortDir='asc'; logOrder=BASE_KEYS.slice(); selectedSet.clear();
  renderLanding(); if(window.scrollTo) window.scrollTo({top:0});
}

function refreshLogTable(){
  const log=LOGS[activeTab], t=log.table;
  const nameEl=document.getElementById('logName'); if(nameEl) nameEl.textContent=log.short;
  let list=t.rows.slice();
  const q=searchTerm.trim().toLowerCase();
  if(q) list=list.filter(r=> r.cells.some(c=> String(c).toLowerCase().includes(q)) );
  if(sortCol!=null){
    list.sort((a,b)=>{
      const x=a.cells[sortCol], y=b.cells[sortCol];
      const nx=Number(x), ny=Number(y);
      const cmp=(!isNaN(nx)&&!isNaN(ny)&&x!==''&&y!=='') ? (nx-ny) : String(x).localeCompare(String(y));
      return sortDir==='asc'?cmp:-cmp;
    });
  }
  const cntEl=document.getElementById('logCnt'); if(cntEl) cntEl.textContent=`${list.length} of ${t.rows.length} events`+(q?' (filtered)':'');
  const ro = STEPS[qIdx] && (STEPS[qIdx].type==='verdict' || STEPS[qIdx].type==='input');
  const rowsHtml=list.map(r=>{
    let cls = ro ? 'ro' : (selectedSet.has(r.id) ? 'click selected' : 'click');
    const cb=`<td class="cbx"><span class="cb"></span></td>`;
    const cells=r.cells.map(c=>`<td>${c}</td>`).join('');
    const attr = ro ? '' : 'tabindex="0" role="button"';
    return `<tr data-id="${r.id}" class="${cls}" ${attr}>${cb}${cells}</tr>`;
  }).join('');
  const emptyRow = `<tr><td class="cbx"></td><td colspan="${t.cols.length}" style="color:var(--muted);padding:14px 12px">No matching events.</td></tr>`;
  const heads=t.cols.map((c,ci)=>{
    const on=sortCol===ci;
    const car = on ? (sortDir==='asc'?'&#9652;':'&#9662;') : '&#9662;';
    return `<th data-ci="${ci}" class="sortable${on?' on':''}">${c}<span class="caret">${car}</span></th>`;
  }).join('');
  const box=document.getElementById('logbox');
  if(!box) return;
  box.innerHTML=`<table><thead><tr><th class="cbx"></th>${heads}</tr></thead><tbody>${rowsHtml||emptyRow}</tbody></table>`;
  box.querySelectorAll('th.sortable').forEach(th=> th.addEventListener('click',()=> sortBy(parseInt(th.dataset.ci,10))) );
  if(ro) return;
  box.querySelectorAll('tr.click').forEach(tr=>{
    const hnd=()=>onToggle(tr.dataset.id, tr);
    tr.addEventListener('click',hnd);
    tr.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();hnd();} });
  });
}

function renderQuestion(){
  questionComplete=false;
  selectedSet.clear();
  selectedVerdict=null;
  searchTerm=''; sortCol=null; sortDir='asc';
  const se=document.getElementById('entSearch'); if(se) se.value='';
  updateTabs();
  refreshLogTable();
  const s=STEPS[qIdx];
  const isFirstL3 = s.level===3 && (STEPS[qIdx-1]||{}).level!==3;
  const unlock = isFirstL3 ? `<div class="unlock">Expert tier unlocked: <b>EDR telemetry</b> (SHA256, command lines) added as a log source. CyberChef recommended for decoding.</div>` : '';
  const cyber = s.level>=3 ? `<a class="cc-link" href="https://gchq.github.io/CyberChef/" target="_blank" rel="noopener">Open CyberChef &#8599;</a>` : '';
  let answerHTML;
  if(s.type==='verdict'){
    const opts=s.options.map((o,i)=>`<button class="vopt" data-i="${i}">${o}</button>`).join('');
    answerHTML=`<div class="verdict-opts">${opts}</div>
      <div class="answerbar"><span class="selinfo" id="selInfo">Select a determination, then submit</span><button class="btn" id="answerBtn" disabled>Submit</button>${cyber}</div>`;
  } else if(s.type==='input'){
    answerHTML=`<div class="ans-row"><input class="ans-input" id="ansInput" placeholder="${s.placeholder||'Type your answer'}" autocomplete="off" spellcheck="false"><button class="btn" id="answerBtn" disabled>Submit</button>${cyber}</div>
      <div class="selinfo" id="selInfo" style="margin-top:8px">${s.hintline||'Decode the value, then type your answer.'}</div>`;
  } else {
    answerHTML=`<div class="answerbar"><span class="selinfo" id="selInfo"></span><button class="btn" id="answerBtn" disabled>Submit</button>${cyber}</div>`;
  }
  document.getElementById('qpanel').innerHTML=`
    <div class="qcount">Task <b>${qIdx+1}</b> of ${STEPS.length}${s.level>=2?' &middot; Level 2':''}</div>
    ${unlock}
    <div class="task"><h2>${s.title}</h2><p>${s.mission}</p></div>
    <div id="answerArea">${answerHTML}</div>
    <div class="feedback" id="fb"></div>`;
  document.getElementById('answerBtn').onclick=onSubmit;
  if(s.type==='verdict'){
    document.querySelectorAll('.vopt').forEach(b=>{ b.onclick=()=>onVerdictPick(parseInt(b.dataset.i,10), b); });
  }
  if(s.type==='input'){
    const ai=document.getElementById('ansInput');
    ai.addEventListener('input',()=>{ document.getElementById('answerBtn').disabled = !ai.value.trim(); });
    ai.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); onSubmit(); } });
    ai.focus();
  }
  updateAnswerBar();
  setProgress();
}

function onVerdictPick(i, btn){
  if(questionComplete) return;
  selectedVerdict=i;
  document.querySelectorAll('.vopt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  updateAnswerBar();
}

function updateAnswerBar(){
  const s=STEPS[qIdx];
  const btn=document.getElementById('answerBtn');
  const info=document.getElementById('selInfo');
  if(!btn) return;
  if(s.type==='input'){ const ai=document.getElementById('ansInput'); btn.disabled = !(ai && ai.value.trim()); return; }
  if(s.type==='verdict'){
    btn.disabled = selectedVerdict===null;
    info.textContent = selectedVerdict===null ? 'Select a determination, then submit' : 'Determination selected';
    return;
  }
  const n=selectedSet.size;
  btn.disabled=n===0;
  if(n===0){ info.textContent = s.mode==='all' ? 'Select the matching rows (may be more than one), then submit' : 'Select a row to flag it as evidence'; }
  else { info.textContent = `${n} row(s) selected`; }
}

function onToggle(id, tr){
  if(questionComplete) return;
  const s=STEPS[qIdx];
  if(s.mode==='any'){
    selectedSet.clear();
    document.querySelectorAll('#logbox tr.selected').forEach(x=>x.classList.remove('selected'));
    selectedSet.add(id); tr.classList.add('selected');
  } else {
    if(selectedSet.has(id)){ selectedSet.delete(id); tr.classList.remove('selected'); }
    else { selectedSet.add(id); tr.classList.add('selected'); }
  }
  updateAnswerBar();
}

function onSubmit(){
  if(questionComplete) return;
  const s=STEPS[qIdx];
  if(s.type==='verdict'){
    if(selectedVerdict===null) return;
    if(selectedVerdict===s.correct){ questionSolved(s); }
    else { wrong++; showNudge("Incorrect", s.wrongMsg || "Tinjau kembali buktinya sebelum memutuskan."); }
    return;
  }
  if(s.type==='input'){
    const ai=document.getElementById('ansInput'); const raw=(ai?ai.value:'')||'';
    if(!raw.trim()) return;
    const _norm=x=>String(x).toLowerCase().replace(/\s+/g,'').replace(/^["'`]+|["'`]+$/g,'');
    const nv=_norm(raw);
    const ok=s.accept.some(a=>{ const na=_norm(a); return nv===na || nv.includes(na); });
    if(ok){ questionSolved(s); } else { wrong++; showNudge("Incorrect", s.wrongMsg || "Belum tepat. Coba decode ulang."); }
    return;
  }
  const sel=[...selectedSet];
  if(!sel.length) return;
  const targetLog = rowLog[s.targets[0]];
  const wrongSel = sel.filter(id=>!s.targets.includes(id));
  if(wrongSel.length){
    wrong++;
    const bad=wrongSel[0];
    const tr=document.querySelector(`#logbox tr[data-id="${bad}"]`);
    if(tr){ tr.classList.add('wrong'); tr.classList.remove('selected'); setTimeout(()=>tr.classList.remove('wrong'),400); }
    selectedSet.delete(bad);
    let msg;
    if(s.decoy && s.decoy[bad]) msg=s.decoy[bad];
    else if(s.decoy && s.decoy.def && rowLog[bad]===targetLog) msg=s.decoy.def;
    else msg="Baris itu bukan jawaban untuk pertanyaan ini. Tinjau lagi pertanyaannya, lalu telusuri sumber log yang ada.";
    showNudge("Incorrect", msg);
    updateAnswerBar();
    return;
  }
  if(s.mode==='all' && !s.targets.every(t=>selectedSet.has(t))){
    showNudge("Partial", "Benar sejauh ini, tapi belum semua. Masih ada yang lain, cari lagi lalu submit.");
    return;
  }
  questionSolved(s);
}

function questionSolved(s){
  questionComplete=true;
  solved++;
  selectedSet.clear();
  setProgress();
  refreshLogTable();
  const ab=document.getElementById('answerArea'); if(ab) ab.style.display='none';
  const fb=document.getElementById('fb');
  fb.className='feedback good show';
  const last = qIdx===STEPS.length-1;
  fb.innerHTML=`<h3>&#10003; ${s.good.title}</h3><p>${s.good.body}</p>
    <div class="next-row"><button class="btn" id="nextBtn">${last?'View incident summary':'Next task'}</button></div>`;
  document.getElementById('nextBtn').onclick=()=>{
    if(last){ renderConclusion(); }
    else { qIdx++; renderQuestion(); window.scrollTo({top:0,behavior:'smooth'}); }
  };
  if(fb.scrollIntoView) fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function showNudge(title,body){
  const fb=document.getElementById('fb');
  if(!fb) return;
  fb.className='feedback nudge show';
  fb.innerHTML=`<h3>${title}</h3><p>${body}</p>`;
}

  if(wrong<=2){ rank="Analis Senior"; note="Nyaris tanpa salah langkah. Analisis yang tajam."; }
  else if(wrong<=5){ rank="Analis Madya"; note="Bukti diikuti dengan baik dan tidak terjebak umpan palsu."; }
  app.innerHTML = navHTML(false) + `
